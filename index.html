<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Launcher</title>
<style>
:root{--bg:#0e1016;--card:#181b24;--fg:#e8eaf0;--mute:#8a90a0;--acc:#ffb84d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;padding:32px 16px}
h1{text-align:center;font-size:28px;margin:0 0 28px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:820px;margin:0 auto}
a.card{display:block;background:var(--card);border:2px solid #262a36;border-radius:12px;padding:22px;color:inherit;text-decoration:none;transition:.15s}
a.card:hover{border-color:var(--acc);transform:translateY(-3px)}
.card b{display:block;font-size:20px;margin-bottom:8px;direction:ltr;text-align:right}
.card span{color:var(--mute);font-size:14px;line-height:1.7}
.play{margin-top:14px;color:var(--acc);font-weight:bold}
</style>
</head>
<body>
<h1>🎮 لانچر بازی‌ها</h1>
<div class="grid" id="g"></div>
<script>
// برای افزودن بازی جدید فقط یک خط به این فهرست اضافه کنید
const GAMES = [
  {name:"NOVA: Endless Demolition", path:"pixel-arcade/", desc:"آرکید دوبعدی پیکسل‌آرت با دنیای بی‌انتها و کاملاً تخریب‌پذیر."},
  {name:"BLACK VEIL", path:"tactical-zombie/", desc:"بازی تاکتیکال سه‌بعدی زامبی با نمای از بالا."},
];
document.getElementById('g').innerHTML = GAMES.map(g =>
  `<a class="card" href="${g.path}"><b>${g.name}</b><span>${g.desc}</span><div class="play">▶ اجرا</div></a>`).join('');
</script>
</body>
</html>
