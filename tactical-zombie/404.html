<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>انتقال به بازی…</title>
<script>
  // هر آدرس قدیمی یا اشتباه زیر این سایت را به صفحهٔ اصلی بازی می‌برد
  (function () {
    var parts = location.pathname.split('/');
    var base = location.hostname.endsWith('github.io') && parts[1] ? '/' + parts[1] + '/' : '/';
    location.replace(base);
  })();
</script>
</head>

</body>
