<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>BLACK VEIL</title>
<style>
:root{color-scheme:dark;--bg:#07080a;--panel:rgba(14,18,20,.82);--line:#2c363b;--text:#e9eee9;--muted:#9fb0b3;--gold:#e8c15a;font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%}
canvas#cv{position:fixed;inset:0;display:block;cursor:none}
button,select{font:inherit;color:var(--text);background:#1a2226;border:1px solid var(--line);border-radius:3px;min-height:32px;padding:4px 10px;cursor:pointer;touch-action:manipulation}
button:hover{background:#263238;border-color:#5b6c72}
button.primary{background:var(--gold);color:#1b1c16;border-color:var(--gold);font-weight:bold}
button.big{font-size:18px;padding:10px 34px}
kbd{font:bold 11px monospace;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 4px;margin-inline-end:5px}
[hidden]{display:none!important}

/* ---------- صفحه‌ها ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 12px;background:rgba(3,4,5,.78);z-index:20;touch-action:pan-y}
.card{background:rgba(9,11,13,.94);border:1px solid var(--line);border-top:2px solid var(--gold);padding:20px 26px;max-width:640px;width:100%;margin:auto}
.card.pause{max-width:560px}.card.end{max-width:620px;text-align:center}
h2{margin:0 0 12px;font-size:20px;letter-spacing:1px}
h2.big{font-size:38px;margin:4px 0 14px;font-weight:900}
.eh{color:var(--muted);letter-spacing:2px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;gap:4px}.seg button{min-width:86px}.seg button.on{background:var(--gold);border-color:var(--gold);color:#14130d;font-weight:bold}
.team{border-inline-start:3px solid var(--tc);padding:8px 14px;margin-bottom:10px;background:rgba(0,0,0,.45)}
.team h3{margin:0 0 6px;font-size:16px;color:var(--tc);display:flex;align-items:center;gap:8px}
.cnt{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
.cnt button{min-width:32px;font-weight:bold}.cnt b{min-width:18px;text-align:center;font-size:17px}
.mem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.mem .role{min-width:128px;font-size:13px;color:#d7dfdf}
.mem select{flex:1;min-width:150px;max-width:260px;font-size:13px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:rgba(0,0,0,.5);padding:10px 6px;text-align:center}.stats b{display:block;font-size:24px;color:var(--gold)}.stats span{font-size:12px;color:var(--muted)}
.roll{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin:14px 0;text-align:start}
.roll div{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid #1e2529;padding:3px 0;font-size:13px}.roll i{color:#ff6b6b;font-style:normal}.roll span{color:var(--muted);font-size:11px;margin-inline-start:auto}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 16px;font-size:12.5px;margin-top:10px}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #1e2529;padding:3px 0}.keys span{color:#cfd8d8}
#bigmap{width:100%;height:auto;border:1px solid var(--line);image-rendering:pixelated}
#zone i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

/* ---------- منوی اصلی ---------- */
#menu{background:none;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding:0;overflow:hidden;align-items:stretch;justify-content:stretch}
#mHead{display:flex;align-items:flex-end;gap:22px;padding:34px 56px 0}
.logo b{display:block;font:900 30px/1 "Segoe UI",Arial,sans-serif;letter-spacing:9px;color:#fff;direction:ltr}
.logo span{display:block;font:11px/1.8 "Segoe UI",Arial,sans-serif;letter-spacing:6px;color:var(--gold);direction:ltr;text-align:right}
#mCrumb span{display:inline-block;border-inline-start:2px solid var(--gold);padding-inline-start:12px;color:#d5dcdc;font-size:17px;letter-spacing:1px}
#mBody{padding:26px 56px;overflow:auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
#mFoot{display:flex;align-items:center;gap:18px;padding:14px 56px;border-top:1px solid rgba(255,255,255,.1);background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);min-height:54px;font-size:12px;color:var(--muted)}
#mFoot .back{margin-inline-end:auto}
.s-title #mHead,.s-title #mFoot{visibility:hidden}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;direction:ltr}
.title h1{margin:0;font:900 clamp(44px,9vw,120px)/1 "Segoe UI",Arial,sans-serif;letter-spacing:.18em;color:#fff;text-shadow:0 0 60px rgba(0,0,0,.9),0 4px 0 #000}
.title .sub{letter-spacing:.9em;color:var(--gold);font:14px "Segoe UI",Arial,sans-serif;margin-top:14px;padding-left:.9em}
.title .press{direction:rtl;margin-top:13vh;color:#e9eee9;font-size:15px;letter-spacing:1px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.mlist{display:flex;flex-direction:column;gap:2px;width:min(430px,100%)}
.mlist button{display:flex;align-items:baseline;justify-content:space-between;gap:14px;text-align:start;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent);border:0;border-inline-start:3px solid transparent;border-radius:0;padding:13px 20px;min-height:0;transition:padding .12s,background .12s;color:#b9c3c4}
.mlist button b{font-size:27px;font-weight:800;letter-spacing:1px}
.mlist button small{font:11px "Segoe UI",Arial,sans-serif;letter-spacing:4px;opacity:.6}
.mlist button.on,.mlist button:hover{border-inline-start-color:var(--gold);background:linear-gradient(270deg,rgba(232,193,90,.26),transparent);color:#fff;padding-inline-start:34px}
.mlist.small{width:100%;margin-bottom:8px}.mlist.small button b{font-size:19px}.mlist.small button{padding:9px 16px}
.camp{display:flex;flex-direction:column;gap:22px}
.mrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mcard{flex:0 0 220px;display:flex;flex-direction:column;padding:0;border:1px solid #232b30;border-radius:0;background:rgba(6,8,9,.85);text-align:start;min-height:0;opacity:.75;transition:transform .12s,opacity .12s}
button.mcard:hover{opacity:1;background:rgba(6,8,9,.85)}
.mcard.on{opacity:1;border-color:var(--gold);transform:translateY(-6px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.mcard .art{height:124px;position:relative;background:linear-gradient(180deg,#0c0e11,#151a1e)}
.mcard .art em{position:absolute;top:8px;inset-inline-end:10px;color:#7dffb0;font-style:normal;font-size:18px}
.art.a-crash{background:radial-gradient(ellipse at 62% 78%,rgba(255,110,40,.75) 0,rgba(120,30,10,.5) 22%,transparent 46%),radial-gradient(ellipse at 60% 40%,rgba(10,6,16,.95) 0,transparent 42%),linear-gradient(180deg,#0a0b10 0,#2a1614 72%,#060607 73%)}
.art.a-zones{background:conic-gradient(from 200deg at 50% 60%,#1f5a35,#6a5c1c,#6a221c,#1a0f2a,#1c4a6a,#1f5a35)}
.mcard .mi{padding:10px 14px 12px;border-top:1px solid #232b30;display:flex;flex-direction:column;gap:2px}
.mcard .mi small{color:var(--gold);letter-spacing:2px;font-size:11px}.mcard .mi b{font-size:22px}.mcard .mi span{color:var(--muted);font-size:12px}
.mcard.locked{opacity:.4}.mcard.locked .mi b{color:#7d898b;font-size:16px}
.lock{position:absolute;left:50%;top:50%;width:26px;height:20px;margin:-6px 0 0 -13px;background:#4b5559;border-radius:3px}
.lock::before{content:"";position:absolute;left:5px;top:-13px;width:12px;height:13px;border:3px solid #4b5559;border-bottom:0;border-radius:9px 9px 0 0}
.cbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cbar .diff{display:flex;align-items:center;gap:12px}
.cbar #bStart{margin-inline-start:auto}
button.big{font-size:19px;padding:12px 44px;letter-spacing:1px}
.panel{width:min(820px,100%);background:rgba(6,8,9,.82);border-top:2px solid var(--gold);padding:18px 22px;max-height:100%;overflow:auto}
.ph{margin:14px 0 2px;font-size:14px;color:var(--gold);letter-spacing:1px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:60}
#fade.on{opacity:1}
#intro{left:28px;bottom:280px;display:flex;flex-direction:column;gap:3px;opacity:0;direction:rtl;text-align:start;text-shadow:0 2px 6px #000}
#intro b{font-size:30px;font-weight:900;letter-spacing:1px}#intro span{font-size:14px;color:#e9eee9;letter-spacing:2px}
#intro.run{animation:intro 7s forwards}
#intro.run>*{clip-path:inset(0 0 0 100%);animation:type 1.1s steps(22) forwards}#intro.run>:nth-child(2){animation-delay:1.1s}#intro.run>:nth-child(3){animation-delay:2.1s}
@keyframes type{to{clip-path:inset(0)}}
@keyframes intro{0%,82%{opacity:1}100%{opacity:0}}
@media (max-width:820px),(max-height:560px){#mHead{padding:14px 18px 0}#mBody{padding:12px 18px}#mFoot{padding:8px 18px;min-height:40px}.mlist button b{font-size:20px}.mlist button{padding:8px 14px}.mcard{flex-basis:160px}.mcard .art{height:74px}.keys{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}h2.big{font-size:26px}#intro{left:12px;bottom:auto;top:120px}#intro b{font-size:20px}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px}
#hud>*{position:absolute}
#squads{top:8px;left:8px;width:236px;display:flex;flex-direction:column;gap:6px;direction:rtl}
.sq{background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--tc);border-radius:8px;padding:4px 7px}
.sqh{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}.sqh b{color:var(--tc)}.sqh span{color:var(--muted);font-size:11px;text-align:end}
.m{display:grid;grid-template-columns:1fr 64px 46px;align-items:center;gap:5px;font-size:11.5px;line-height:1.55}
.m .n small{color:var(--muted);margin-inline-start:4px;font-size:10px}.m .w{color:#b9c6c8;font-size:10.5px;white-space:nowrap;overflow:hidden}
.m .hp{height:5px;background:#000;border-radius:3px;overflow:hidden;direction:ltr}.m .hp i{display:block;height:100%;background:#67e08a}
.m.down{color:#ff8a8a}.m.dead{opacity:.4;text-decoration:line-through}
#topR{top:8px;right:8px;width:229px;display:flex;flex-direction:column;gap:5px}
#mini{width:229px;height:168px;border:2px solid var(--line);border-radius:8px;background:#000;image-rendering:pixelated}
#zone,#obj{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#zone{display:flex;align-items:center;gap:6px;font-weight:bold}
#obj div{line-height:1.7;font-size:12px}#obj .done{color:#7dffb0;opacity:.75}#obj .k{color:var(--muted);border-top:1px solid var(--line);margin-top:3px;padding-top:2px}
#banner{top:16%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7),transparent);padding:10px 80px;white-space:nowrap}
#banner.show{opacity:1}#banner b{display:block;font-size:26px}#banner span{color:#d5dcdc;font-size:13px}
#log{left:8px;bottom:128px;width:340px;display:flex;flex-direction:column;gap:3px}
.msg{background:rgba(8,10,11,.72);border-inline-start:3px solid #888;border-radius:4px;padding:3px 8px;font-size:12px;transition:opacity .9s}.msg.fade{opacity:0}
#prompt{left:50%;bottom:150px;transform:translateX(-50%);background:rgba(0,0,0,.78);border:1px solid var(--gold);color:var(--gold);padding:6px 16px;border-radius:8px;font-size:14px;white-space:nowrap}
#status{left:8px;bottom:8px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.barw{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11px}.barw span{width:34px;color:var(--muted)}.barw b{width:28px;text-align:center}
.bar{flex:1;height:9px;background:#000;border-radius:5px;overflow:hidden;direction:ltr}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e04848,#67e08a)}.bar.st{height:5px}.bar.st i{background:#6fc3ff}
#weapon{display:grid;grid-template-columns:1.3fr 1.3fr .8fr;gap:4px;margin-top:4px}
.ws{background:rgba(0,0,0,.35);border:1px solid transparent;border-radius:6px;padding:2px 6px;opacity:.6;line-height:1.35}
.ws.on{opacity:1;border-color:var(--gold)}.ws b{display:block;font-size:12px}.ws small{display:block;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden}.ws span{font-size:13px;color:var(--gold);direction:ltr;display:block;text-align:right}
.inv{grid-column:1/-1;display:flex;gap:12px;font-size:11px;color:var(--muted)}.inv b{color:var(--text)}
.stick{width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.stick i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.3)}
#tbtns{display:none}

/* ---------- لمسی و صفحه‌های کوچک ---------- */
body.touch #tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;right:8px;top:50%;transform:translateY(-58%);pointer-events:auto;width:168px}
body.touch #tbtns button{min-height:38px;font-size:12px;padding:2px;background:rgba(14,18,20,.7)}
body.touch #tbtns button.wide{grid-column:1/-1;border-color:var(--gold);color:var(--gold);min-height:44px}
body.touch kbd{display:none}
body.touch canvas#cv{cursor:default}
@media (max-height:560px),(max-width:820px){
  #hud{font-size:11px}
  #squads{width:150px;gap:3px}.m{grid-template-columns:1fr 34px}.m .w{display:none}.m .n small{display:none}.sqh span{display:none}
  #topR{width:140px}#mini{width:140px;height:103px}#obj div{font-size:10px;line-height:1.5}#zone{font-size:10px}
  #status{width:200px;padding:4px 6px}#weapon{grid-template-columns:1fr}.ws{display:none}.ws.on{display:flex;gap:6px;align-items:center}.ws small{display:none}
  #log{width:230px;bottom:auto;top:8px;left:164px}.msg{font-size:10.5px;padding:2px 6px}
  #prompt{bottom:auto;top:30%}#banner b{font-size:18px}
  #obj{position:fixed;top:8px;left:372px;width:230px}#log{width:200px}
  body.touch #tbtns{top:150px;bottom:auto;transform:none;width:140px;gap:4px}body.touch #tbtns button{min-height:30px;font-size:10.5px}
  .card{padding:12px}
}

.card.armory{max-width:780px}#obj .fail{color:#ff6b6b;opacity:.9}.cntf{margin-inline-start:auto;color:var(--muted);font-size:12px;font-weight:normal}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="squads"></div>
  <div id="topR">
    <canvas id="mini" width="225" height="165"></canvas>
    <div id="zone"></div>
    <div id="obj"></div>
  </div>
  <div id="banner"></div>
  <div id="log"></div>
  <div id="prompt" hidden></div>
  <div id="intro"></div>
  <div id="status">
    <div class="barw"><span>سلامت</span><div class="bar"><i id="hpF"></i></div><b id="hpT"></b></div>
    <div class="barw"><span>نفس</span><div class="bar st"><i id="stF"></i></div></div>
    <div id="weapon"></div>
  </div>
  <div id="stickL" class="stick" hidden><i></i></div>
  <div id="stickR" class="stick" hidden><i></i></div>
  <div id="tbtns">
    <button data-a="use">اقدام</button><button data-a="reload">خشاب</button><button data-a="swap">سلاح</button>
    <button data-a="frag">نارنجک</button><button data-a="knife">چاقو</button><button data-a="med">درمان</button>
    <button data-a="lure">طعمه</button><button data-a="map">نقشه</button><button data-a="pause">توقف</button>
    <button data-a="wheel" class="wide">فرمان</button>
  </div>
</div>

<div id="menu" class="screen">
  <div id="mHead"><div class="logo"><b>BLACK VEIL</b><span>TACTICAL COMMAND</span></div><div id="mCrumb"></div></div>
  <div id="mBody"></div>
  <div id="mFoot"></div>
</div>
<div id="modal" class="screen" hidden></div>
<div id="fade"></div>

<script>

  let s = (seed >>> 0) || 1;
  const f = function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
  return f;
};

      if (P.mag > 0 || P.rel > 0) u.cur = 0;
      return;
    }
    const d = dist(u, t), a = Math.atan2(t.y - u.y, t.x - u.x);
    u.ang = G.turn(u.ang, a, 11 * dt);
    let wi = -1;
    if (d < 36 + t.r) wi = 2;
    else if (usable(u, P, t, d) && !(P.rel > 0 && d < 230 && usable(u, S, t, d) && S.mag > 0)) wi = 0;
    else if (usable(u, S, t, d)) wi = 1;
    else if (d < 60 + t.r) wi = 2;
    if (u.grenades > 0 && u.gcd <= 0 && d > 150 && d < 350 && !sq.holdFire && (cluster(t, 95) >= 5 || (BIG[t.form] && t.hp > 200)) && !friendNear(t.x, t.y, 135)) {
      G.throwItem(u, t.x, t.y, 'frag'); u.gcd = 7; return;
    }
    if (wi < 0) { if (P.mag <= 0) G.startReload(u, P); if (S.mag <= 0) G.startReload(u, S); return; }
    u.cur = wi; const w = u.weapons[wi];
    if (w.mag <= 0 && !w.def.melee) { G.startReload(u, w); return; }
    if (Math.abs(G.angDiff(u.ang, a)) < .16) G.fire(u, u.ang, t.x, t.y);
  }

  /* ---------- وظایف فردی ---------- */
  function runTask(u, dt, spd) {
    const k = u.task;
    if (k.type === 'revive') {
      const w = k.who; if (w.dead || !w.downed) { u.task = null; return false; }
      if (dist(u, w) > 28) { if (!navTo(u, w.x, w.y, dt, spd * 1.25)) u.task = null; k.t = 0; }
      else { k.t += dt; u.reviving = true; if (k.t >= 3) { G.revive(w, u); u.task = null; } }
      return true;
    }
    if (k.type === 'lure') {
      k.t += dt; const d = Math.hypot(k.x - u.x, k.y - u.y);
      if ((d > 340 || !G.losClear(u.x, u.y, k.x, k.y, true)) && k.t < 14) { if (!navTo(u, k.x, k.y, dt, spd * 1.2)) k.t = 99; }
      else { G.throwItem(u, k.x, k.y, 'lure'); u.task = null; }
      return true;
    }
    u.task = null; return false;
  }
  G.killSoldier = function (s) {
    if (s.dead) return;
    G.fx.burst(s.x, s.y - 8, '#0b0b10', 26, 170, .7, 4); G.fx.ring(s.x, s.y, 54, '#1a0f2a');
    s.hp = 0; s.downed = true; s.bleed = 0; s.target = null; s.task = null;
  };
  G.revive = function (w, by) {
    w.downed = false; w.hp = Math.round(w.maxHp * .45); w.bleed = 0;
    G.msg(`${w.name} احیا شد${by && !by.isCmd ? ' (توسط ' + by.name + ')' : ''}.`, '#7dffb0'); G.stats.revives++;
  };
  function medicCheck(u) {
    if (G.noRevive) return;
    let best = null, bd = 520;
    for (const s of G.soldiers) { if (s === u || s.dead || !s.downed || s.isCmd) continue; const d = dist(u, s); if (d < bd && !G.soldiers.some(o => o !== u && o.task && o.task.type === 'revive' && o.task.who === s)) { bd = d; best = s; } }
    if (best) { u.task = { type: 'revive', who: best, t: 0 }; G.msg(`${u.name}: دارم میام سراغ ${best.name}!`, '#7dffb0'); }
  }

  /* ---------- حرکت شکاری (حمله/پاکسازی/جستجو) ---------- */
  // عقب‌نشینی رو به دشمن (بدن به سمت هدف می‌ماند و تیراندازی ادامه دارد)؛ اگر پشت سر بسته بود به پهلو می‌رود
  function backOff(u, t, dt, spd) {
    const a = Math.atan2(u.y - t.y, u.x - t.x), x0 = u.x, y0 = u.y; u.kite = u.kite || (Math.random() < .5 ? 1 : -1);
    G.moveEnt(u, Math.cos(a) * spd * dt, Math.sin(a) * spd * dt);
    if (Math.hypot(u.x - x0, u.y - y0) < spd * dt * .5) { const b = a + u.kite * 1.35; G.moveEnt(u, Math.cos(b) * spd * dt, Math.sin(b) * spd * dt); if (Math.hypot(u.x - x0, u.y - y0) < spd * dt * .4) u.kite = -u.kite; }
    u.moving = true; u.mvAng = a + Math.PI; u.backing = true;
  }
  function huntMove(u, dt, spd, z) {
    const d = dist(u, z), P = u.weapons[0].def, long = P.range >= 650 || P.expl;
    const pref = G.clamp((P.expl ? 420 : P.range) * .55, 150, long ? 380 : 260), keep = long ? 190 : P.pellets > 1 ? 95 : 135;
    const tz = u.target && !u.target.dead ? u.target : null;
    if (tz) {
      const td = dist(u, tz), mobile = G.ZT[tz.form].speed > 0;
      if (mobile && td < keep) backOff(u, tz, dt, spd * (td < keep * .55 ? 1 : .8));        // دشمن نزدیک شد: عقب برو و بزن
      else if (td > pref && !(mobile && tz.tgt === u)) navTo(u, tz.x, tz.y, dt, spd * .8); // هنوز دور است: آرام نزدیک شو
      // در بُرد مناسب: بایست و شلیک کن
    } else if (d > 40) { if (!navTo(u, z.x, z.y, dt, spd * (d > 500 ? .95 : .7))) { z.noPathT = G.time + 8; u.hunt = null; } } // پیشروی محتاطانه
  }

  /* ---------- هوش سرباز ---------- */
  function aiSoldier(u, dt) {
    const sq = G.squads[u.squad], o = sq.order, cmd = G.cmd;
    u.thinkT -= dt; u.moving = false; u.reviving = false;
    if (u.thinkT <= 0) {
      u.thinkT = .16 + Math.random() * .12; pickTarget(u, sq);
      if (u.medic && !u.task) medicCheck(u);
      if (u.hunt && u.hunt.dead) u.hunt = null;
    }
    if (u.target && u.target.dead) u.target = null;
    if (u.gcd > 0) u.gcd -= dt;
    const spd = u.speed * u.slow;
    for (const p of G.pools) { const d = Math.hypot(u.x - p.x, u.y - p.y); if (d < p.r + 14) { const a = d > 1 ? Math.atan2(u.y - p.y, u.x - p.x) : u.ang + Math.PI; G.moveEnt(u, Math.cos(a) * spd * 1.3 * dt, Math.sin(a) * spd * 1.3 * dt); u.moving = true; u.mvAng = a; combat(u, dt, sq); return; } }
    if (u.task && runTask(u, dt, spd)) { if (!u.reviving) combat(u, dt, sq); return; }
    switch (o.type) {
      case 'follow': case 'regroup': case 'cover': {
        const tz = u.target; if (tz && !tz.dead && o.type !== 'regroup' && G.ZT[tz.form].speed > 0 && dist(u, tz) < 85) { backOff(u, tz, dt, spd * .85); break; }
        const ms = alive(sq), i = ms.indexOf(u), n = ms.length; let p;
        if (o.type === 'cover') {
          const c = o.who === 'cmd' ? cmd : (alive(G.squads.alpha)[0] || cmd);
          p = fixSlot(slotAt(c.x + Math.cos(o.dir) * 120, c.y + Math.sin(o.dir) * 120, o.dir + Math.PI, 'line', sq.key, i, n, -34), c.x, c.y);
          u.face = o.dir + Math.PI;
        } else { p = fixSlot(slotAt(cmd.x, cmd.y, cmd.heading, sq.form, sq.key, i, n, extraBackFor(sq, sq.form)), cmd.x, cmd.y); u.face = p.face; }
        const d = Math.hypot(p.x - u.x, p.y - u.y);
        if (d > (cmd.moving ? 10 : 20)) navTo(u, p.x, p.y, dt, spd * (o.type === 'regroup' || d > 150 ? 1.45 : d > 60 ? 1.12 : .95));
        break;
      }
      case 'post': case 'patrol': { const d = Math.hypot(u.sx - u.x, u.sy - u.y); if (d > 8) navTo(u, u.sx, u.sy, dt, spd * (o.type === 'patrol' ? .7 : 1.1)); break; }
      case 'assault': case 'clear': case 'sd': {
        if (!u.hunt || u.hunt.dead) {
          if (o.type === 'assault') u.hunt = findHunt(u, u.x, u.y, 400) || (Math.hypot(u.x - o.x, u.y - o.y) < 260 ? findHunt(u, o.x, o.y, 330) : null);
          else if (o.type === 'clear') u.hunt = findHunt(u, o.x, o.y, o.R);
          else u.hunt = findHunt(u, o.x, o.y, o.R) || findHunt(u, u.x, u.y, 450);
        }
        if (u.hunt) { huntMove(u, dt, spd, u.hunt); break; }
        if (u.target) { huntMove(u, dt, spd, u.target); break; }
        if (o.type === 'clear' && u.wps && u.wps.length) {
          const w = u.wps[0]; if (Math.hypot(w.x - u.x, w.y - u.y) < 30 || !navTo(u, w.x, w.y, dt, spd)) u.wps.shift();
        } else if (o.type !== 'sd') { const d = Math.hypot(u.sx - u.x, u.sy - u.y); if (d > 10) navTo(u, u.sx, u.sy, dt, spd * 1.1); }
        break;
      }
      case 'fireat': {
        const zt = findHunt(u, o.x, o.y, 90);
        if (zt) { u.target = zt; if (dist(u, zt) > 380 || !G.losClear(u.x, u.y, zt.x, zt.y)) navTo(u, zt.x, zt.y, dt, spd); break; }
        const P = u.weapons[0].def.expl ? (u.weapons[1].def.expl ? -1 : 1) : 0;
        if (P < 0) break;
        const d = Math.hypot(o.x - u.x, o.y - u.y), ld = d || 1, w = u.weapons[P], rng = Math.min(w.def.range - 40, 480);
        const los = G.losClear(u.x, u.y, o.x - (o.x - u.x) / ld * 24, o.y - (o.y - u.y) / ld * 24, true);
        if (d > rng || !los) { navTo(u, o.x, o.y, dt, spd * 1.1); break; }
        const a = Math.atan2(o.y - u.y, o.x - u.x); u.ang = G.turn(u.ang, a, 10 * dt); u.target = null; u.cur = P;
        if (Math.abs(G.angDiff(u.ang, a)) < .1) {
          if (w.mag <= 0) G.startReload(u, w);
          else if (G.fire(u, u.ang, o.x, o.y)) { o.shots++; const b = G.map.block[o.tile]; if (o.tile >= 0 && b && !G.SOLID[b]) G.damageTile(o.tile, w.def.dmg * (w.def.pellets || 1) * .7, false); }
        }
        return;
      }
      case 'destroy': case 'firesup': {
        const d = Math.hypot(o.x - u.x, o.y - u.y);
        const ex = u.weapons[0].def.expl ? 0 : u.weapons[1].def.expl ? 1 : -1;
        const can = (ex >= 0 && (u.weapons[ex].mag > 0 || u.weapons[ex].res !== 0)) || (o.type === 'destroy' && u.grenades > 0);
        if (!can) { if (o.type === 'destroy' && d > 240) navTo(u, o.x, o.y, dt, spd); break; }
        const reach = ex >= 0 ? Math.min(u.weapons[ex].def.range - 40, 420) : 320;
        const ld = Math.hypot(o.x - u.x, o.y - u.y) || 1, los = G.losClear(u.x, u.y, o.x - (o.x - u.x) / ld * 24, o.y - (o.y - u.y) / ld * 24, true);
        if (d > reach || !los) { navTo(u, o.x, o.y, dt, spd * 1.1); break; }

        if (d < minD) { const a = Math.atan2(u.y - o.y, u.x - o.x); G.moveEnt(u, Math.cos(a) * spd * dt, Math.sin(a) * spd * dt); u.moving = true; u.mvAng = a; break; }
        const a = Math.atan2(o.y - u.y, o.x - u.x); u.ang = G.turn(u.ang, a, 10 * dt); u.target = null;
        if (Math.abs(G.angDiff(u.ang, a)) < .08 && !friendNear(o.x, o.y, minD - 20)) {
          if (ex >= 0) { u.cur = ex; const w = u.weapons[ex]; if (w.mag <= 0) G.startReload(u, w); else if (G.fire(u, u.ang, o.x, o.y)) { u.supShots = (u.supShots || 0) + 1; o.shots++; } }
          else if (u.gcd <= 0 && G.throwItem(u, o.x, o.y, 'frag')) { u.gcd = 2.2; o.shots++; }
        }
        return;
      }
    }
    combat(u, dt, sq);
  }

  function restorePrev(sq, o, ms) {
    const p = o.prev && o.prev.type !== 'destroy' && o.prev.type !== 'firesup' && o.prev.type !== 'fireat' ? o.prev : { type: 'follow' };
    if (p.type === 'post' || p.type === 'follow' || p.type === 'cover') { sq.order = p; sq.label = p.type === 'follow' ? 'دنبال فرمانده' : p.type === 'cover' ? 'کاور' : 'استقرار'; }
    else { sq.order = { type: 'post', kind: 'hold', x: ms[0].x, y: ms[0].y }; ms.forEach(u => { u.sx = u.x; u.sy = u.y; }); sq.label = 'ایست'; }

  }

  /* ---------- به‌روزرسانی جوخه ---------- */
  function squadUpdate(sq, dt) {
    const o = sq.order, ms = alive(sq), cmd = G.cmd; if (!ms.length) return;
    if (o.type === 'regroup') { if (ms.every(u => dist(u, cmd) < 150)) { sq.order = { type: 'follow' }; sq.label = 'دنبال فرمانده'; } }
    else if (o.type === 'patrol') {
      const tgt = o.leg ? o.b : o.a;
      if (ms.every(u => Math.hypot(u.sx - u.x, u.sy - u.y) < 46)) { o.wait += dt; if (o.wait > 2.5) { o.wait = 0; o.leg = 1 - o.leg; const n = o.leg ? o.b : o.a; assignPosts(sq, n.x, n.y, Math.atan2(n.y - tgt.y, n.x - tgt.x), 'column'); } }
    }
    else if (o.type === 'clear') {
      o.t += dt;
      if (o.t > 1.5 && ms.every(u => !u.wps || !u.wps.length) && !findHunt(ms[0], o.x, o.y, o.R)) {
        G.msg(`${sq.short}: منطقه پاک شد.`, sq.color); sq.order = { type: 'post', kind: 'move', x: o.x, y: o.y, h: o.h }; sq.label = 'استقرار پس از پاکسازی'; G.audio.play('radio');
      }
    }
    else if (o.type === 'sd') {
      if (ms.some(u => u.hunt || u.target)) o.idle = 0; else o.idle += dt;
      if (o.idle > 3) { G.msg(`${sq.short}: هدفی باقی نمانده؛ برمی‌گردیم.`, sq.color); sq.order = { type: 'follow' }; sq.label = 'دنبال فرمانده'; G.audio.play('radio'); }
    }
    else if (o.type === 'assault') {
      if (ms.every(u => Math.hypot(u.sx - u.x, u.sy - u.y) < 40) && !ms.some(u => u.hunt || u.target)) { sq.order = { type: 'post', kind: 'move', x: o.x, y: o.y, h: o.h }; sq.label = 'استقرار پس از حمله'; G.msg(`${sq.short}: موضع تصرف شد.`, sq.color); }
    }
    else if (o.type === 'fireat') {
      o.t += dt;
      const zNear = findHunt(ms[0], o.x, o.y, 90), broke = o.tile >= 0 && !G.map.block[o.tile];
      let end = o.t > 30 || broke || (o.tile < 0 && !zNear && o.shots >= 4 * ms.length);
      if (o.tile >= 0 && o.shots > 90) end = true;
      if (end) { if (broke) G.msg(`${sq.short}: مانع از بین رفت.`, sq.color); restorePrev(sq, o, ms); }
    }
    else if (o.type === 'destroy' || o.type === 'firesup') {
      o.t += dt; let end = false, ok = false;
      if (o.ent && !o.ent.dead) { o.x = o.ent.x; o.y = o.ent.y; }
      if (o.ent) {
        if (o.ent.dead) {
          let nx = null, bd = 80; for (const z of G.zombies) { if (z.dead || z.form !== o.ent.form) continue; const d = Math.hypot(z.x - o.x, z.y - o.y); if (d < bd && (z.form === 'sloth')) { bd = d; nx = z; } }
          if (nx) { o.ent = nx; o.x = nx.x; o.y = nx.y; } else { end = true; ok = true; }
        }
      } else if (o.tile >= 0) { if (!G.map.block[o.tile]) { end = true; ok = true; } else if (o.shots >= 14) end = true; } else if (o.shots >= (o.type === 'firesup' ? 3 : o.blast ? 2 : 4)) end = true;
      if (o.type === 'firesup' && !o.ent && o.t > 9) end = true;
      if (o.t > 40) end = true;
      const armed = ms.some(u => (u.weapons[0].def.expl && (u.weapons[0].mag > 0 || u.weapons[0].res !== 0)) || (u.weapons[1].def.expl && (u.weapons[1].mag > 0 || u.weapons[1].res !== 0)) || (o.type === 'destroy' && u.grenades > 0));
      if (!armed && !end) { end = true; G.msg(`${sq.short}: مهمات انفجاری تمام شد!`, '#ff6b6b'); }
      if (end) {
        if (ok) G.msg(`${sq.short}: هدف نابود شد.`, sq.color);
        const p = o.prev && o.prev.type !== 'destroy' && o.prev.type !== 'firesup' ? o.prev : { type: 'follow' };
        if (p.type === 'post' || p.type === 'follow' || p.type === 'cover') { sq.order = p; sq.label = p.type === 'follow' ? 'دنبال فرمانده' : p.type === 'cover' ? 'کاور' : 'استقرار'; }
        else { sq.order = { type: 'post', kind: 'hold', x: ms[0].x, y: ms[0].y }; ms.forEach(u => { u.sx = u.x; u.sy = u.y; }); sq.label = 'ایست'; }

      }
    }

        o.t = 1.2; const c = o.who === 'cmd' ? cmd : (alive(G.squads.alpha)[0] || cmd);

        o.dir = nz ? Math.atan2(c.y - nz.y, c.x - nz.x) : (o.who === 'cmd' ? cmd.heading + Math.PI : o.dir);
      }
    }
  }

  /* ---------- به‌روزرسانی همهٔ سربازان ---------- */
  G.updateSoldiers = function (dt) {
    const cmd = G.cmd;
    for (const sq of [G.squads.alpha, G.squads.delta]) squadUpdate(sq, dt);
    for (const u of G.soldiers) {
      if (u.dead) continue;
      if (u.hurtT > 0) u.hurtT -= dt; if (u.swing > 0) u.swing -= dt; if (u.flashT > 0) u.flashT -= dt;
      if (u.downed) { if (!u.isCmd) { u.bleed -= dt; if (u.bleed <= 0) { u.dead = true; G.stats.lost++; G.msg(`${u.name} کشته شد.`, '#ff4a3c'); G.fx.decal(u.x, u.y, 'blood', '#5a0d0d', 16); } } continue; }
      tickWeapons(u, dt);
      // هالهٔ کندکنندهٔ تنبلی
      u.slow = 1;
      for (const z of G.zActive) { if (!z.dead && z.form === 'sloth' && Math.hypot(z.x - u.x, z.y - u.y) < 95) { u.slow = .6; break; } }
      if (!u.isCmd) {
        aiSoldier(u, dt);
        if (u.medic && !u.moving) { u.healT -= dt; if (u.healT <= 0) { u.healT = .5; for (const s of G.soldiers) if (!s.dead && !s.downed && s.hp < s.maxHp * .8 && dist(u, s) < 70) { s.hp = Math.min(s.maxHp, s.hp + 4); if (Math.random() < .3) G.fx.burst(s.x, s.y - 14, '#7dffb0', 1, 20, .6, 2); } } }
      }

      const a = S[i]; if (a.dead || a.downed) continue;
      for (let j = i + 1; j < S.length; j++) {
        const b = S[j]; if (b.dead || b.downed) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy); if (d >= 19 || d < .01) continue;
        const p = (19 - d) * .5, ux = dx / d, uy = dy / d;

        else { G.moveEnt(a, -ux * p, -uy * p); G.moveEnt(b, ux * p, uy * p); }
      }
    }
  };
})();
</script>
<script>
'use strict';

    };

      if (!r.win) return null;
      const p = G.loadProg(); p.crash = 1; G.saveProg(p);
      return { title: 'عملیات ناموفق', color: '#ff6b6b', roll: team.map(u => ({ name: u.name, role: u.role, team: G.squads[u.squad].short })), stats: [[fa(team.length) + '/' + fa(team.length), 'تلفات'], [fa(1), 'بازمانده']] };
    },
  };

  /* ================= میدان آزمایشی (مرحلهٔ کنار گذاشته‌شده) ================= */
  ML.zones = {
    init() { const S = G.map.sites; G.props.push({ kind: 'beacon', x: S.ex.x, y: S.ex.y - 100 }); },
    canArm() { return !G.mission.coreArmed; },
    onArm() { const M = G.mission; M.coreArmed = true; M.fuse = 25; G.msg('خرج کار گذاشته شد. فاصله بگیرید!', '#ff6bd6'); G.audio.play('alarm'); for (const z of G.zombies) if (z.zone === 3) z.alert = Math.max(z.alert, 40); },
    onBeacon() { const M = G.mission; M.extract = 1; M.exT = 75; M.waveT = 2; G.msg('بالگرد در راه است.', '#4db8ff'); G.audio.play('alarm'); },
    objPoints() {
      const M = G.mission, S = G.map.sites, out = [];
      for (const p of G.props) if (p.kind === 'sample') out.push({ x: p.x, y: p.y, c: '#c9a0ff', t: 'نمونه' });
      if (!M.coreArmed) out.push({ x: S.core.x, y: S.core.y, c: '#ff6bd6', t: 'هسته' });
      if (M.coreDead || M.extract) out.push({ x: S.ex.x, y: S.ex.y, c: '#4db8ff', t: 'خروج' });
      return out;
    },
    objectives() {
      const M = G.mission;
      return [
        { t: `نمونه‌ها (${fa(M.samples)}/${fa(2)})`, done: M.samples >= 2 },
        { t: M.coreArmed && !M.coreDead ? `فاصله بگیر — ${fa(Math.ceil(M.fuse))}` : 'نابودی هسته', done: M.coreDead },
        { t: M.extract === 1 ? `دفاع تا رسیدن بالگرد — ${fa(Math.max(0, Math.ceil(M.exT)))}` : M.extract === 2 ? 'سوار بالگرد شو' : 'خروج با بالگرد', done: false },
      ];
    },
    update(dt) {
      const M = G.mission, S = G.map.sites, u = G.cmd, m = G.map;
      if (M.coreArmed && !M.coreDead) {
        M.fuse -= dt; if (((M.fuse * 2) | 0) !== (((M.fuse + dt) * 2) | 0) && M.fuse < 10) G.audio.play('beep', G.dist(u, S.core));
        if (M.fuse <= 0) {
          M.fuse = 0; M.coreDead = true; for (const [x, y] of m.coreTiles) m.block[y * m.w + x] = 0;
          for (let k = 0; k < 7; k++) G.explode(S.core.x + G.rand(-90, 90), S.core.y + G.rand(-70, 70), 240, 900, null);
          G.fx.shake(26); G.stats.score += 1000;
          for (const z of G.zombies) if (z.zone >= 2) z.alert = 70;
          G.spawnRing(S.core.x, S.core.y, 380, 620, ['wrath', 'wrath', 'greed', 'envy'], Math.round(26 * G.diff.count));
          G.ui.banner('هسته نابود شد', '#ff6bd6', '');
        }
      }
      if (M.extract === 1) {
        M.exT -= dt; M.waveT -= dt;
        if (M.waveT <= 0) { M.waveT = 8; const pool = M.exT < 35 ? ['wrath', 'wrath', 'greed', 'greed', 'envy', 'pride', 'gluttony'] : ['wrath', 'wrath', 'greed', 'greed', 'envy']; G.spawnRing(S.ex.x, S.ex.y, 560, 820, pool, Math.round((7 + (75 - M.exT) / 9) * G.diff.count)); }
        if (M.exT <= 12 && !M.heli) { const sx = S.ex.x + 1600, sy = S.ex.y - 700; M.heli = G.makeHeli(sx, sy, Math.atan2(S.ex.y - sy, S.ex.x - sx), { z: 120, rotor: 1, phase: 'cruise' }); G.Heli.flyTo(M.heli, S.ex.x, S.ex.y, true); G.props.push(M.heli); }
        if (M.exT <= 0 && M.heli && M.heli.phase === 'idle') { M.extract = 2; G.ui.banner('بالگرد فرود آمد', '#4db8ff', ''); }
      }
      if (M.extract === 2 && Math.hypot(u.x - M.heli.x, u.y - M.heli.y) < 120) { M.boardT = (M.boardT || 0) + dt; if (M.boardT > 2) G.endMission(true, ''); } else M.boardT = 0;
    },
    end() {
      const r = G.result, team = G.soldiers.filter(x => !x.isCmd), surv = team.filter(x => !x.dead).length;
      if (!r.win) return null;
      return { title: 'خروج موفق', color: '#7dffb0', stats: [[fa(surv) + '/' + fa(team.length), 'نیروی زنده']] };
    },
  };
})();
</script>
<script>
'use strict';
/* رابط کاربری: منوها، HUD، چرخ فرمان، ورودی صفحه‌کلید/ماوس/لمسی */
(function () {
  const $ = id => document.getElementById(id), fa = G.fa;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  let hudT = 0, bannerT = 0, mapOpen = false, screen = 'title', selM = 'crash', curM = 'crash';
  const ui = G.ui = Object.assign(G.ui || {}, { wheel: { open: false, k: 0, vx: 0, vy: 0, sel: null, wheel: 'main', tgt: { x: 0, y: 0 } } });
  const W = ui.wheel;
  G.dev = /[?&]dev\b/.test(location.search);

  /* ---------- پیام‌های بی‌سیم ---------- */
  G.msg = function (text, color) {
    const log = $('log'); if (!log) return;
    const d = el('div', 'msg'); d.textContent = text; d.style.borderColor = color || '#888'; log.appendChild(d);
    while (log.children.length > 5) log.removeChild(log.firstChild);
    setTimeout(() => { d.classList.add('fade'); setTimeout(() => d.remove(), 900); }, 6500);
  };
  ui.banner = function (title, color, sub) { const b = $('banner'); b.innerHTML = `<b style="color:${color}">${title}</b><span>${sub || ''}</span>`; b.classList.add('show'); bannerT = 3.2; };
  const tick = () => G.audio.play('ui');
  function show(id, on) { $(id).hidden = !on; }

  /* ================= منوها ================= */
  function wOpts(pool, sel) { return G.POOL[pool].map(id => { const w = G.WEAPONS[id]; return `<option value="${id}"${id === sel ? ' selected' : ''}>${w.name} — ${w.cls}</option>`; }).join(''); }
  const KEYS = [['W A S D', 'حرکت'], ['Shift', 'دویدن'], ['ماوس', 'نشانه‌گیری'], ['کلیک چپ', 'شلیک'], ['R', 'خشاب'], ['Q / چرخ ماوس', 'تعویض سلاح'], ['G', 'نارنجک'], ['T', 'طعمه'], ['F', 'چاقو'], ['H', 'درمان'], ['E', 'اقدام'], ['کلیک راست (نگه‌دار)', 'چرخ فرمان'], ['Tab (نگه‌دار)', 'چرخ فرمان'], ['M', 'نقشه'], ['Esc', 'توقف']];
  const keysHtml = () => `<div class="keys">${KEYS.map(k => `<div><kbd>${k[0]}</kbd><span>${k[1]}</span></div>`).join('')}</div>`;
  const SCREENS = {
    title() { return { crumb: '', body: `<div class="title"><h1>BLACK VEIL</h1><div class="sub">TACTICAL COMMAND</div><div class="press">برای شروع کلیک کن یا کلیدی را فشار بده</div></div>`, foot: '' }; },
    main() {
      const items = [['campaign', 'کارزار', 'CAMPAIGN'], ['loadout', 'جوخه و سلاح', 'LOADOUT'], ['options', 'تنظیمات', 'OPTIONS']];
      return { crumb: 'منوی اصلی', body: `<nav class="mlist">${items.map((it, i) => `<button data-go="${it[0]}" class="${i === 0 ? 'on' : ''}"><b>${it[1]}</b><small>${it[2]}</small></button>`).join('')}</nav>`, foot: '<span><kbd>↑↓</kbd>انتخاب</span><span><kbd>Enter</kbd>تأیید</span>' };
    },
    campaign() {
      const st = G.settings, prog = G.loadProg(), ms = G.MISSIONS.filter(m => !m.hidden || G.dev);
      const cur = ms.find(m => m.id === selM && !m.locked) || ms[0]; selM = cur.id;
      const cards = ms.map(m => m.locked
        ? `<div class="mcard locked"><div class="art"><i class="lock"></i></div><div class="mi"><small>عملیات ${fa(String(m.n).padStart(2, '0'))}</small><b>قفل</b></div></div>`
        : `<button class="mcard${m.id === selM ? ' on' : ''}" data-m="${m.id}"><div class="art a-${m.id}">${prog[m.id] ? '<em>✔</em>' : ''}</div><div class="mi"><small>عملیات ${fa(String(m.n).padStart(2, '0'))}</small><b>${m.name}</b><span>${m.loc} · ${m.time}</span></div></button>`).join('');
      return {
        crumb: 'کارزار', body: `<div class="camp"><div class="mrow">${cards}</div>
          <div class="cbar"><div class="diff"><label>سختی</label><div class="seg" id="diff">${G.DIFFS.map((d, i) => `<button data-v="${i}" class="${st.diff === i ? 'on' : ''}">${d.name}</button>`).join('')}</div></div>
          <button id="bStart" class="primary big">شروع عملیات</button></div></div>`, foot: '<span><kbd>Esc</kbd>بازگشت</span><span><kbd>Enter</kbd>شروع</span>',
      };
    },
    loadout() {
      const st = G.settings;
      let h = `<div class="team" style="--tc:#e8c15a"><h3>فرمانده</h3><div class="mem"><span class="role">سلاح اصلی</span><select data-t="cmd" data-k="p">${wOpts('cmd', st.cmd.p)}</select><span class="role">سلاح دوم</span><select data-t="cmd" data-k="s">${wOpts('sec', st.cmd.s)}</select></div></div>`;
      for (const key of ['alpha', 'delta']) {
        const TM = G.TEAMS[key], n = st[key + 'N'];
        h += `<div class="team" style="--tc:${TM.color}"><h3>${TM.name}<small class="cntf">${fa(n)} نفر</small></h3>`;
        for (let i = 0; i < n; i++) { const r = TM.roles[i]; h += `<div class="mem"><span class="role">${r.name} · ${r.role}</span><select data-t="${key}" data-i="${i}" data-k="p">${wOpts(key, st[key][i].p)}</select><select data-t="${key}" data-i="${i}" data-k="s">${wOpts('sec', st[key][i].s)}</select></div>`; }
        h += '</div>';
      }
      return { crumb: 'جوخه و سلاح', body: `<div class="panel">${h}<div class="btns"><button id="bReset">پیش‌فرض</button></div></div>`, foot: '<span><kbd>Esc</kbd>بازگشت</span>' };
    },
    options() {
      const st = G.settings;
      return { crumb: 'تنظیمات', body: `<div class="panel"><div class="row"><label>صدا</label><div class="seg" id="snd"><button data-v="1" class="${st.sound ? 'on' : ''}">روشن</button><button data-v="0" class="${st.sound ? '' : 'on'}">خاموش</button></div></div><h3 class="ph">کنترل‌ها</h3>${keysHtml()}</div>`, foot: '<span><kbd>Esc</kbd>بازگشت</span>' };
    },
  };
  function go(name, silent) {
    screen = name; const s = SCREENS[name](), body = $('mBody'), st = G.settings;
    $('menu').className = 'screen s-' + name; $('mCrumb').innerHTML = s.crumb ? `<span>${s.crumb}</span>` : '';
    body.innerHTML = s.body; $('mFoot').innerHTML = (name !== 'title' && name !== 'main' ? '<button id="bBack" class="back">بازگشت</button>' : '') + s.foot;
    if (!silent) tick();
    const bb = $('bBack'); if (bb) bb.onclick = back;
    body.querySelectorAll('[data-go]').forEach(b => { b.onclick = () => go(b.dataset.go); b.onmouseenter = () => { body.querySelectorAll('[data-go]').forEach(x => x.classList.toggle('on', x === b)); }; });
    body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { selM = b.dataset.m; go('campaign'); });
    body.querySelectorAll('#diff button').forEach(b => b.onclick = () => { st.diff = +b.dataset.v; G.saveSettings(); go(name); });
    body.querySelectorAll('#snd button').forEach(b => b.onclick = () => { st.sound = +b.dataset.v; G.saveSettings(); go(name); });
    body.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { const k = b.dataset.n + 'N'; st[k] = G.clamp(st[k] + (+b.dataset.d), 1, 6); G.saveSettings(); go(name); });
    body.querySelectorAll('select').forEach(x => x.onchange = () => { const t = x.dataset.t; if (t === 'cmd') st.cmd[x.dataset.k] = x.value; else st[t][+x.dataset.i][x.dataset.k] = x.value; G.saveSettings(); });
    const bs = $('bStart'); if (bs) bs.onclick = () => start(selM);
    const br = $('bReset'); if (br) br.onclick = () => { const snd = st.sound, df = st.diff; G.settings = G.defaultSettings(); G.settings.sound = snd; G.settings.diff = df; G.saveSettings(); go(name); };
    if (name === 'title') body.querySelector('.title').onclick = () => { G.audio.init(); go('main'); };
  }
  function back() { if (screen === 'title') return; go(screen === 'main' ? 'title' : 'main'); }
  function menuKey(e) {
    const k = e.code;
    if (screen === 'title') { G.audio.init(); go('main'); return; }
    if (k === 'Escape' || k === 'Backspace') { back(); return; }
    if (screen === 'main') {
      const bs = Array.from($('mBody').querySelectorAll('[data-go]')), i = bs.findIndex(b => b.classList.contains('on'));
      if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'KeyS' || k === 'KeyW') { const n = (i + (k === 'ArrowDown' || k === 'KeyS' ? 1 : bs.length - 1)) % bs.length; bs.forEach((b, j) => b.classList.toggle('on', j === n)); tick(); }
      else if (k === 'Enter' || k === 'Space') bs[Math.max(0, i)].click();
    } else if (screen === 'campaign' && k === 'Enter') start(selM);
  }
  ui.toMenu = function (scr) { G.state = 'menu'; W.open = false; show('menu', true); show('hud', false); show('modal', false); go(scr || 'main', true); };
  function start(id) {
    G.audio.init(); curM = id || curM; const f = $('fade'); f.classList.add('on');
    setTimeout(() => {
      show('menu', false); show('modal', false); show('hud', true);
      try { G.startMission(curM); } catch (e) { console.error(e); ui.toMenu('campaign'); }
      setTimeout(() => f.classList.remove('on'), 350);
    }, 420);
  }
  ui.onStart = function () {
    W.open = false; W.k = 0; mapOpen = false; $('log').innerHTML = ''; buildSquads(); hud(); G.resize();
    const m = G.mdef, it = $('intro');
    it.innerHTML = `<b>«${m.name}»</b><span>عملیات ${fa(String(m.n).padStart(2, '0'))}</span><span>${m.loc} — ${m.time}</span>`;
    it.classList.remove('run'); void it.offsetWidth; it.classList.add('run');
  };

  /* ================= چرخ فرمان ================= */
  const itemText = c => c.id === 'form' ? 'آرایش: ' + G.FORMS.find(f => f[0] === G.squads.alpha.form)[1] : c.id === 'fire' ? (G.squads.alpha.holdFire ? 'آتش آزاد' : 'آتش‌بس') : c.t;
  ui.wheelText = itemText;
  function wheelPick() {
    const R = G.WHEELS[W.wheel], d = Math.hypot(W.vx, W.vy); if (d < 30) { W.sel = null; return; }
    const a = Math.atan2(W.vy, W.vx) * 180 / Math.PI, n = R.items.length, i = ((Math.round((a - R.off) / R.span) % n) + n) % n, it = R.items[i];
    if ((it.sub || it.back) && d > 75) { W.wheel = it.sub || 'main'; W.vx = W.vy = 0; W.sel = null; W.reorigin = true; G.audio.play('radio'); return; }
    if (!W.sel || W.sel.it !== it) G.audio.play('beep'); W.sel = { it, i };
  }
  function wheelOpen(ox, oy) {
    if (G.state !== 'play' || W.open || G.cmd.downed || G.cmd.boarded) return;
    W.open = true; W.wheel = 'main'; W.vx = W.vy = 0; W.sel = null; W.ox = ox; W.oy = oy; W.tgt = { x: G.input.world.x, y: G.input.world.y }; G.input.fire = false; G.audio.play('radio');
  }
  function wheelMove(dx, dy) { W.vx += dx; W.vy += dy; const d = Math.hypot(W.vx, W.vy); if (d > 120) { W.vx *= 120 / d; W.vy *= 120 / d; } wheelPick(); }
  function wheelClose() {
    if (!W.open) return; W.open = false; const s = W.sel; W.sel = null; if (!s || s.it.sub || s.it.back) return;
    G.command(W.wheel === 'main' ? 'all' : W.wheel, s.it.id, s.it.pt ? W.tgt : null);
  }

  /* ================= پنل جوخه‌ها و HUD ================= */
  function buildSquads() {
    const box = $('squads'); box.innerHTML = '';
    for (const key of ['alpha', 'delta']) {
      const sq = G.squads[key], d = el('div', 'sq'); d.style.setProperty('--tc', sq.color);
      d.innerHTML = `<div class="sqh"><b>${sq.name}</b><span id="ord_${key}"></span></div>` + sq.members.map(u => `<div class="m" id="m_${u.id}"><span class="n">${u.name}<small>${u.role}</small></span><span class="w"></span><span class="hp"><i></i></span></div>`).join('');
      box.appendChild(d);
    }
  }
  function hud() {
    const u = G.cmd, M = G.mission; if (!u) return;
    $('hpF').style.width = (u.hp / u.maxHp * 100) + '%'; $('hpT').textContent = fa(Math.ceil(u.hp)); $('stF').style.width = (u.stamina * 100) + '%';
    let h = '';
    u.weapons.forEach((w, i) => { const d = w.def; h += `<div class="ws${i === u.cur ? ' on' : ''}"><b>${d.name}</b><small>${d.cls}</small><span>${d.melee ? '∞' : (w.rel > 0 ? '⟳' : fa(w.mag) + ' / ' + (w.res < 0 ? '∞' : fa(w.res)))}</span></div>`; });
    h += `<div class="inv"><span>نارنجک <b>${fa(u.grenades)}</b></span><span>طعمه <b>${fa(u.lures)}</b></span><span>درمان <b>${fa(u.medkits)}</b></span></div>`;
    $('weapon').innerHTML = h;
    for (const key of ['alpha', 'delta']) {
      const sq = G.squads[key]; $('ord_' + key).textContent = sq.label + (sq.holdFire ? ' · آتش‌بس' : '');
      for (const m of sq.members) {
        const r = $('m_' + m.id); if (!r) continue;
        r.className = 'm' + (m.dead ? ' dead' : m.downed ? ' down' : '');
        const w = m.weapons[m.cur]; r.children[1].textContent = m.dead ? 'کشته شد' : m.downed ? `زمین‌خورده ${fa(Math.ceil(m.bleed))}` : w.def.name + (w.rel > 0 ? ' ⟳' : '');
        const f = r.children[2].firstChild; f.style.width = (m.dead ? 0 : m.hp / m.maxHp * 100) + '%'; f.style.background = m.hp > m.maxHp * .5 ? '#67e08a' : m.hp > m.maxHp * .25 ? '#ffd23c' : '#ff5a5a';
      }
    }
    const zn = Math.max(0, G.zoneNow), z = G.ZONES[zn]; $('zone').innerHTML = `<i style="background:${z.color}"></i>${G.zoneName(zn)}`;
    $('obj').innerHTML = G.objectives().map(o => `<div class="${o.fail ? 'fail' : o.done ? 'done' : ''}">${o.fail ? '✖' : o.done ? '✔' : '◻'} ${o.t}</div>`).join('');
    const p = $('prompt'); p.textContent = M.prompt; p.hidden = !M.prompt;
    G.drawMinimap($('mini'), false);
    if (mapOpen) G.drawMinimap($('bigmap'), true);
  }
  ui.tick = function (dt) {
    hudT -= dt; if (hudT <= 0) { hudT = .12; hud(); }
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('show'); }
  };

  /* ================= پنجره‌ها ================= */
  function modal(html, cls) { const m = $('modal'); m.innerHTML = `<div class="card ${cls || ''}">${html}</div>`; show('modal', true); return m; }
  function closeModal() { show('modal', false); mapOpen = false; if (G.state === 'pause') G.state = 'play'; }
  ui.pause = function () {
    if (G.state !== 'play') return; G.state = 'pause'; W.open = false;
    const m = modal(`<h2>توقف</h2><nav class="mlist small"><button id="bRes" class="on"><b>ادامه</b></button><button id="bRst"><b>شروع دوباره</b></button><button id="bMenu"><b>خروج به منو</b></button></nav>${keysHtml()}`, 'pause');
    m.querySelector('#bRes').onclick = closeModal; m.querySelector('#bRst').onclick = () => start(curM); m.querySelector('#bMenu').onclick = () => ui.toMenu('main');
  };
  ui.toggleMap = function () {
    if (mapOpen) { closeModal(); return; } if (G.state !== 'play') return; G.state = 'pause'; mapOpen = true; W.open = false;
    const m = modal(`<h2>نقشه</h2><canvas id="bigmap" width="900" height="660"></canvas><div class="btns"><button id="bRes" class="primary">بستن</button></div>`);
    const bm = $('bigmap'); bm.height = Math.round(900 * G.map.h / G.map.w);
    m.querySelector('#bRes').onclick = closeModal; G.drawMinimap(bm, true);
  };
  ui.openArmory = function () {
    G.state = 'pause'; W.open = false; const u = G.cmd;
    let h = `<h2>تدارکات</h2><div class="team" style="--tc:#e8c15a"><h3>فرمانده</h3><div class="mem"><span class="role">اصلی</span><select data-u="0" data-k="0">${wOpts('cmd', u.weapons[0].id)}</select><span class="role">دوم</span><select data-u="0" data-k="1">${wOpts('sec', u.weapons[1].id)}</select></div></div>`;
    for (const key of ['alpha', 'delta']) {
      const sq = G.squads[key], ms = sq.members.filter(x => !x.dead); if (!ms.length) continue;
      h += `<div class="team" style="--tc:${sq.color}"><h3>${sq.name}</h3>` + ms.map(x => `<div class="mem"><span class="role">${x.name} · ${x.role}</span><select data-u="${x.id}" data-k="0">${wOpts(key, x.weapons[0].id)}</select><select data-u="${x.id}" data-k="1">${wOpts('sec', x.weapons[1].id)}</select></div>`).join('') + '</div>';
    }
    h += '<div class="btns"><button id="bRes" class="primary">ادامه</button></div>';
    const m = modal(h, 'armory');
    m.querySelectorAll('select').forEach(x => x.onchange = () => { const id = +x.dataset.u, k = +x.dataset.k; if (!id) G.setCmdWeapon(k, x.value); else { const q = G.soldiers.find(o => o.id === id); if (q) G.setSoldierWeapon(q, k, x.value); } });
    m.querySelector('#bRes').onclick = closeModal;
  };
  ui.showEnd = function () {
    const r = G.result, s = G.stats, e = G.logic.end && G.logic.end();
    const mm = Math.floor(G.time / 60), ss = Math.floor(G.time % 60), time = `${fa(mm)}:${fa(String(ss).padStart(2, '0'))}`;
    let h;
    if (!e) h = `<h2 class="big" style="color:#ff6b6b">فرمانده از پا درآمد</h2><div class="btns"><button id="bRst" class="primary">تلاش دوباره</button><button id="bMenu">خروج به منو</button></div>`;
    else h = `<small class="eh">عملیات ${fa(String(G.mdef.n).padStart(2, '0'))} — «${G.mdef.name}»</small><h2 class="big" style="color:${e.color}">${e.title}</h2>
      <div class="stats">${e.stats.concat([[fa(s.kills), 'کشته'], [time, 'زمان']]).map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
      ${e.roll ? `<div class="roll">${e.roll.map(x => `<div><i>✝</i><b>${x.name}</b><span>${x.team} · ${x.role}</span></div>`).join('')}</div>` : ''}
      <div class="btns"><button id="bMenu" class="primary">ادامه</button><button id="bRst">دوباره</button></div>`;
    const m = modal(h, 'end');
    m.querySelector('#bRst').onclick = () => start(curM); m.querySelector('#bMenu').onclick = () => ui.toMenu(e ? 'campaign' : 'main');
  };

  /* ================= ورودی ================= */
  function bindInput() {
    const I = G.input, cv = $('cv');
    window.addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
      const k = e.code;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(k) >= 0) e.preventDefault();
      if (G.state === 'menu') { if (!e.repeat) menuKey(e); return; }
      if (G.state === 'end') return;
      if (k === 'Escape' || k === 'KeyP') { if (W.open) { W.open = false; W.sel = null; } else if (G.state === 'pause') closeModal(); else ui.pause(); return; }
      if (k === 'KeyM') { if (!e.repeat) ui.toggleMap(); return; }
      if (G.state !== 'play') return;
      I.keys[k] = true; if (e.repeat) return;
      if (k === 'Tab') wheelOpen(I.mx, I.my);
      else if (k === 'KeyE') { I.eHeld = true; I.ePressed = true; }
      else if (k === 'KeyR') G.cmdAct('reload'); else if (k === 'KeyQ') G.cmdAct('swap'); else if (k === 'KeyG') G.cmdAct('frag'); else if (k === 'KeyT') G.cmdAct('lure');
      else if (k === 'KeyF' || k === 'KeyV') G.cmdAct('knife'); else if (k === 'KeyH') G.cmdAct('med');
    });
    window.addEventListener('keyup', e => { I.keys[e.code] = false; if (e.code === 'KeyE') I.eHeld = false; if (e.code === 'Tab') wheelClose(); });
    window.addEventListener('blur', () => { I.keys = {}; I.fire = false; I.eHeld = false; W.open = false; });
    window.addEventListener('mousemove', e => {
      if (W.open) { const dx = e.movementX != null ? e.movementX : e.clientX - I.mx, dy = e.movementY != null ? e.movementY : e.clientY - I.my; wheelMove(dx, dy); }
      I.mx = e.clientX; I.my = e.clientY;
    });
    cv.addEventListener('mousedown', e => {
      G.audio.init(); I.mx = e.clientX; I.my = e.clientY; if (G.state !== 'play') return;
      if (e.button === 2) { wheelOpen(e.clientX, e.clientY); return; }
      if (W.open) return;
      if (e.button === 0) { I.fire = true; I.firePressed = true; }
    });
    window.addEventListener('mouseup', e => { if (e.button === 0) I.fire = false; if (e.button === 2) wheelClose(); });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('wheel', e => { if (G.state === 'play' && !W.open) G.cmdAct(e.deltaY > 0 ? 'swap' : 'swapBack'); e.preventDefault(); }, { passive: false });

    // لمسی
    let L = null, Rr = null; const SR = 52;
    const stick = (id, s) => { const e = $(id); if (!s) { e.hidden = true; return; } e.hidden = false; e.style.left = (s.ox - 60) + 'px'; e.style.top = (s.oy - 60) + 'px'; e.firstChild.style.transform = `translate(${s.dx}px,${s.dy}px)`; };
    const upd = (s, t) => { let dx = t.clientX - s.ox, dy = t.clientY - s.oy; const d = Math.hypot(dx, dy); if (d > SR) { dx = dx / d * SR; dy = dy / d * SR; } s.dx = dx; s.dy = dy; };
    cv.addEventListener('touchstart', e => {
      e.preventDefault(); G.audio.init();
      if (!G.touch) { G.touch = true; document.body.classList.add('touch'); G.resize(); }
      if (G.state !== 'play') return;
      for (const t of e.changedTouches) {
        if (t.clientX < window.innerWidth / 2) { if (!L) { L = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 }; stick('stickL', L); } }
        else if (!Rr) { Rr = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 }; stick('stickR', Rr); }
      }
    }, { passive: false });
    cv.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (L && t.identifier === L.id) { upd(L, t); I.moveX = L.dx / SR; I.moveY = L.dy / SR; I.sprint = Math.hypot(L.dx, L.dy) > SR * .92; stick('stickL', L); }
        if (Rr && t.identifier === Rr.id) { upd(Rr, t); const mg = Math.hypot(Rr.dx, Rr.dy) / SR; if (mg > .15) I.aimStick = { x: Rr.dx / SR, y: Rr.dy / SR }; const f = mg > .55; if (f && !I.fire) I.firePressed = true; I.fire = f; stick('stickR', Rr); }
      }
    }, { passive: false });
    const end = e => { for (const t of e.changedTouches) { if (L && t.identifier === L.id) { L = null; I.moveX = I.moveY = 0; I.sprint = false; stick('stickL', null); } if (Rr && t.identifier === Rr.id) { Rr = null; I.fire = false; stick('stickR', null); } } };
    cv.addEventListener('touchend', end); cv.addEventListener('touchcancel', end);
    document.querySelectorAll('#tbtns button').forEach(b => {
      const a = b.dataset.a;
      if (a === 'wheel') { // نگه‌دار و بکش، رها کن
        b.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; wheelOpen(t.clientX, t.clientY); }, { passive: false });
        b.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; if (!W.open) return; if (W.reorigin) { W.reorigin = false; W.ox = t.clientX; W.oy = t.clientY; } W.vx = (t.clientX - W.ox) * 1.4; W.vy = (t.clientY - W.oy) * 1.4; wheelMove(0, 0); }, { passive: false });
        b.addEventListener('touchend', e => { e.preventDefault(); wheelClose(); });
        return;
      }
      b.addEventListener('touchstart', e => { e.preventDefault(); if (a === 'use') { I.eHeld = true; I.ePressed = true; } else if (a === 'map') ui.toggleMap(); else if (a === 'pause') ui.pause(); else G.cmdAct(a); }, { passive: false });
      b.addEventListener('touchend', e => { e.preventDefault(); if (a === 'use') I.eHeld = false; });
      b.addEventListener('click', () => { if (G.touch) return; if (a === 'map') ui.toggleMap(); else if (a === 'pause') ui.pause(); else if (a !== 'use') G.cmdAct(a); });
    });
  }

  ui.init = function () {
    bindInput(); go('title', true);
    if ('ontouchstart' in window && navigator.maxTouchPoints > 0 && !matchMedia('(pointer:fine)').matches) { G.touch = true; document.body.classList.add('touch'); }
  };
  window.addEventListener('DOMContentLoaded', () => G.boot());
})();
</script>
