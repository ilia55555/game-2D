<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انیمیشن راه‌رفتن استیکمن</title><style>*{box-sizing:border-box}body{margin:0;background:#101117;color:#eef4f8;font:14px Tahoma,Arial;overflow:hidden}canvas{width:100vw;height:100dvh;display:block}.panel{position:fixed;top:16px;right:16px;left:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#162333ed;border:1px solid #405570;border-radius:12px;padding:14px}button,select{background:#263e56;color:#fff;border:1px solid #547790;border-radius:7px;padding:9px;font:inherit;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{accent-color:#7adddf}#scrub{width:min(40vw,400px)}small{color:#a6bed1}footer{position:fixed;bottom:18px;left:16px;right:16px;text-align:center;color:#b2c9da;font-size:12px;line-height:1.9}@media(max-width:650px){.panel{gap:8px;padding:10px;font-size:12px}button{font-size:12px}#scrub{width:50vw}}</style><canvas id="game"></canvas><div class="panel"><strong>چرخهٔ قدم‌زدن بدون سلاح</strong><button id="play">توقف ⏸</button><button id="restart">از ابتدا ↺</button><label>سرعت<select id="speed"><option value="0.5">۰٫۵×</option><option value="1" selected>۱×</option><option value="1.5">۱٫۵×</option><option value="2">۲×</option></select></label><label><input type="checkbox" id="loop" checked>تکرار قدم‌ها</label><label><input type="checkbox" id="joints">مفاصل</label><label><input type="checkbox" id="ghost">دو پوزیشن مرجع</label><label>حرکت<input id="scrub" type="range" min="0" max="1" value="0" step="0.001"><span id="percent">۰٪</span></label><button id="download">دانلود HTML</button><small id="phase">حالت آماده</small></div><footer>ساخته‌شده از دو پوزیشن ارسالی تو • طول ثابت تمام اجزا • حرکت قوسی مفاصل • بدون سلاح • برخورد با زمین<br>دو پوزیشن تو، با مرحلهٔ میانی بلندشدن پا از زمین • نمایش راه‌رفتن درجا</footer><script>

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),FLOOR=585;
const lerp=(a,b,t)=>a+(b-a)*t,point=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),angleMix=(a,b,t)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;
const links=frames[0].segments,parents={waist:null},ordered=[];
(function walk(a){for(const e of links){const b=e.from===a?e.to:e.to===a?e.from:null;if(b&&!(b in parents)){parents[b]=a;ordered.push({a,b,length:e.length});walk(b)}}})('waist');
function ik(hip,target,l1,l2,hint){let dx=target.x-hip.x,dy=target.y-hip.y,d=Math.hypot(dx,dy)||1;const reach=clamp(d,Math.abs(l1-l2)+1e-7,l1+l2-1e-7),ux=dx/d,uy=dy/d;const ankle={x:hip.x+ux*reach,y:hip.y+uy*reach},along=(l1*l1-l2*l2+reach*reach)/(2*reach),height=Math.sqrt(Math.max(0,l1*l1-along*along));const k1={x:hip.x+along*ux-uy*height,y:hip.y+along*uy+ux*height},k2={x:hip.x+along*ux+uy*height,y:hip.y+along*uy-ux*height};return {knee:distance(k1,hint)<distance(k2,hint)?k1:k2,ankle}}
function sample(t,returning=false){t=clamp(t,0,1);const a=frames[0].joints,b=frames[1].joints,n={waist:point(a.waist,b.waist,t)};
for(const e of ordered){const theta=angleMix(angle(a[e.a],a[e.b]),angle(b[e.a],b[e.b]),t);n[e.b]={x:n[e.a].x+Math.cos(theta)*e.length,y:n[e.a].y+Math.sin(theta)*e.length}}
// Feet follow the recorded contact trajectory; knees are solved with two-bone IK.
for(const side of ['Front','Back']){const knee='knee'+side,ankle='ankle'+side,toe='toe'+side;const l1=links.find(e=>e.to===knee).length,l2=links.find(e=>e.to===ankle).length;const target=point(a[ankle],b[ankle],t);const forward=(b[ankle].x-a[ankle].x)*(returning?-1:1)>0;if(forward)target.y-=30*Math.sin(Math.PI*t)**2;const solved=ik(n.hip,target,l1,l2,point(a[knee],b[knee],t));n[knee]=solved.knee;n[ankle]=solved.ankle;const theta=angleMix(angle(a[ankle],a[toe]),angle(b[ankle],b[toe]),t),length=links.find(e=>e.to===toe).length;n[toe]={x:n[ankle].x+Math.cos(theta)*length,y:n[ankle].y+Math.sin(theta)*length}}
// Include stroke thickness and the full head circle in the collision envelope.
const penetration=Math.max(0,...Object.entries(n).map(([id,p])=>p.y+(id==='head'?36:9)-FLOOR));if(penetration>0)for(const p of Object.values(n))p.y-=penetration;
return{joints:n}}

let playing=true,clock=0,last=0,progress=0,returning=false,scale=1,ox=0,oy=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;scale=Math.min(innerWidth/1150,innerHeight/760);ox=(innerWidth-1150*scale)/2;oy=(innerHeight-760*scale)/2+35*scale}addEventListener('resize',resize);resize();
function line(a,b,w,c='#fff'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=w;ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke()}function circle(p,r,c){ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function person(n,joints){for(const e of links)if(e.to!=='head')line(n[e.from],n[e.to],18);circle(n.head,36,'#fff');if(joints)for(const p of Object.values(n))circle(p,5,'#4acafa')}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#101117';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);ctx.fillStyle='#162d50';ctx.fillRect(-30000,FLOOR,60000,30000);ctx.fillStyle='#34567f';ctx.fillRect(-30000,FLOOR,60000,2.3);ctx.translate(245,0);if($('ghost').checked){ctx.globalAlpha=.13;person(frames[0].joints,false);person(frames[1].joints,false);ctx.globalAlpha=1}const pose=sample(progress,returning);person(pose.joints,$('joints').checked)}
const ease=t=>t*t*(3-2*t);
function setProgress(p){progress=p;$('scrub').value=p;$('percent').textContent=Math.round(p*100)+'٪'}
function frame(ms){const dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(playing){clock+=dt*Number($('speed').value);const half=.65,duration=half*2;if(!$('loop').checked&&clock>=half){clock=half;playing=false;syncPlay()}const phase=$('loop').checked?clock%duration:clock;returning=phase>half;setProgress(returning?1-ease((phase-half)/half):ease(phase/half));$('phase').textContent=returning?'قدم پای جلو':'قدم پای عقب'}render();requestAnimationFrame(frame)}
function syncPlay(){$('play').textContent=playing?'توقف ⏸':'پخش ▶'}$('play').onclick=()=>{if(!playing&&!$('loop').checked&&clock>=.65)clock=0;playing=!playing;syncPlay()};$('restart').onclick=()=>{clock=0;returning=false;setProgress(0);playing=true;syncPlay()};$('loop').onchange=()=>{clock=0;returning=false;setProgress(0)};
function inverseEase(p){let lo=0,hi=1;for(let i=0;i<35;i++){const mid=(lo+hi)/2;if(ease(mid)<p)lo=mid;else hi=mid}return(lo+hi)/2}$('scrub').oninput=()=>{playing=false;syncPlay();setProgress(Number($('scrub').value));clock=.65*inverseEase(progress);returning=false;$('phase').textContent='بررسی دستی پوزیشن'};
