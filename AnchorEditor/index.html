<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ابزارهای آماده‌سازی خرگوش</title>
<style>
:root{--bg:#0d1016;--panel:#151b24;--line:#344253;--text:#eef3f9;--muted:#a8b3c2;--accent:#4da3ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}.switcher{direction:rtl;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.title{margin-left:auto}.title strong,.title small{display:block}.title strong{font-size:14px}.title small{margin-top:3px;color:var(--muted);font-size:10px}button,a{min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:#1e2531;color:var(--text);font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{border-color:#637387}button.active{background:#1677ff;border-color:#1677ff}.frame{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:700px){.app{grid-template-rows:102px minmax(0,1fr)}.switcher{align-content:center;flex-wrap:wrap}.title{width:100%;margin:0}.switcher button,.switcher a{flex:1;text-align:center;font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <nav class="switcher" aria-label="انتخاب ابزار">
    <div class="title"><strong>ابزارهای آماده‌سازی خرگوش</strong><small>هیچ‌کدام از تصاویر از مرورگر خارج نمی‌شوند.</small></div>
    <button type="button" class="active" data-tool="rig" aria-pressed="true">ماسک، Pivot و Anchor</button>
    <button type="button" data-tool="crop" aria-pressed="false">برش فریم‌های تصویر</button>
    <a id="openTool" href="rig.html" target="_blank" rel="noopener">بازکردن جداگانه ↗</a>
  </nav>
  <iframe id="toolFrame" class="frame" src="rig.html" title="ابزار ویرایش خرگوش"></iframe>
</div>
<script>
(()=>{
  const frame=document.getElementById('toolFrame');
  const open=document.getElementById('openTool');
  const buttons=[...document.querySelectorAll('[data-tool]')];
  const paths={rig:'rig.html',crop:'crop.html'};
  function select(tool){
    if(!paths[tool])return;
    frame.src=paths[tool];open.href=paths[tool];
    buttons.forEach(button=>{const active=button.dataset.tool===tool;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
    try{localStorage.setItem('rabbit-editor-tool',tool)}catch(_error){}
  }
  buttons.forEach(button=>button.addEventListener('click',()=>select(button.dataset.tool)));
  let saved='rig';try{saved=localStorage.getItem('rabbit-editor-tool')||'rig'}catch(_error){}
  if(saved!=='rig')select(saved);
})();
</script>
</body>
</html>
