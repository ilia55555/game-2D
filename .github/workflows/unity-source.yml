name: AERO Unity source validation
on:
  push:
    paths: ['Unity/**', 'tools/**', '.github/workflows/unity-source.yml']
  pull_request:
    paths: ['Unity/**', 'tools/**', '.github/workflows/unity-source.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tree-sitter tree-sitter-c-sharp
      - run: python tools/verify_unity_source.py --require-audio
