name: Godot validation
on:
  push:
    branches: [games]
  pull_request:
    branches: [games]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the tested Godot version
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip --output /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5-stable_linux.x86_64
      - name: Import and run the integration suite
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.5-stable_linux.x86_64
        run: bash tools/verify.sh
      - name: Verify the exported resource pack
        run: |
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 --headless --path . --export-pack Linux /tmp/velocity.pck
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 --headless --main-pack /tmp/velocity.pck --quit-after 120 -- --test
