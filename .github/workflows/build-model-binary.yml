name: Build model binary

on:
  push:
    branches: [games]
    paths:
      - "model/.parts/**"

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: games
          fetch-depth: 0

      - name: Rebuild GLB when all parts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(model/.parts/velocity_hero_rigged.glb.gz.b64.part*)
          if [ "${#parts[@]}" -ne 9 ]; then
            echo "Waiting for all 9 parts; found ${#parts[@]}."
            exit 0
          fi
          cat "${parts[@]}" | base64 -d | gzip -d > model/velocity_hero_rigged.glb
          test "$(stat -c%s model/velocity_hero_rigged.glb)" -eq 248792
          rm -rf model/.parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/velocity_hero_rigged.glb model/.parts
          git commit -m "افزودن مدل سه‌بعدی Rigged قهرمان" || exit 0
          git push origin HEAD:games
